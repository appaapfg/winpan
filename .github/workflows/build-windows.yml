name: Build Windows Applications

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      YOLO_AUTOINSTALL: "false"
      PYTHONFAULTHANDLER: "1"

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: "pip"

      # --------------------------------------------------
      # Install PyTorch
      # --------------------------------------------------
      - name: Install PyTorch
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upgrade pip."
          }

          python -m pip install `
            torch==2.10.0 `
            torchvision==0.25.0 `
            --index-url https://download.pytorch.org/whl/cu128

          if ($LASTEXITCODE -ne 0) {
            throw "PyTorch installation failed."
          }

      # --------------------------------------------------
      # Install requirements
      # --------------------------------------------------
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Requirements installation failed."
          }

      # --------------------------------------------------
      # Install Ultralytics optional dependency
      # --------------------------------------------------
      - name: Install lap
        shell: pwsh
        run: |
          python -m pip install lap==0.5.13

          if ($LASTEXITCODE -ne 0) {
            throw "lap installation failed."
          }

      # --------------------------------------------------
      # Verify the environment
      # --------------------------------------------------
      - name: Verify dependencies
        shell: pwsh
        run: |
          python --version
          python -m pip --version

          python -m pip show torch
          python -m pip show torchvision
          python -m pip show ultralytics
          python -m pip show PySide6
          python -m pip show pyinstaller
          python -m pip show lap

          python -c "import PySide6; print('PySide6 import OK')"
          python -c "import PyInstaller; print('PyInstaller:', PyInstaller.__version__)"

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency verification failed."
          }

      # --------------------------------------------------
      # Install the local package
      # --------------------------------------------------
      - name: Install local package
        shell: pwsh
        run: |
          python -m pip install .

          if ($LASTEXITCODE -ne 0) {
            throw "Local package installation failed."
          }

      # --------------------------------------------------
      # Build App 1: panop
      # --------------------------------------------------
      - name: Build App 1 - panop
        shell: pwsh
        timeout-minutes: 60
        run: |
          Write-Host "Starting panop build..."

          python -u -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "panop" `
            --log-level DEBUG `
            pan_opticon.py 2>&1 |
            Tee-Object -FilePath panop-build.log

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed to build panop. Check panop-build.log."
          }

          Write-Host "panop build completed successfully."

      # --------------------------------------------------
      # Build App 2: pananno
      # --------------------------------------------------
      - name: Build App 2 - pananno
        shell: pwsh
        timeout-minutes: 60
        run: |
          Write-Host "Starting pananno build..."

          python -u -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "pananno" `
            --log-level INFO `
            pan_annotator.py

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed to build pananno."
          }

          Write-Host "pananno build completed successfully."

      # --------------------------------------------------
      # Build App 3: pantrain
      # --------------------------------------------------
      - name: Build App 3 - pantrain
        shell: pwsh
        timeout-minutes: 60
        run: |
          Write-Host "Starting pantrain build..."

          python -u -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "pantrain" `
            --log-level INFO `
            pan_trainer.py

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed to build pantrain."
          }

          Write-Host "pantrain build completed successfully."

      # --------------------------------------------------
      # Prepare release
      # --------------------------------------------------
      - name: Prepare release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          Copy-Item -Recurse dist/panop release/panop
          Copy-Item -Recurse dist/pananno release/pananno
          Copy-Item -Recurse dist/pantrain release/pantrain

      # --------------------------------------------------
      # Upload Windows builds
      # --------------------------------------------------
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: MyApps-Windows
          path: release/

      # --------------------------------------------------
      # Preserve diagnostic output even if the build fails
      # --------------------------------------------------
      - name: Upload panop diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panop-build-diagnostics
          path: |
            panop-build.log
            build/panop/warn-panop.txt
            build/panop/xref-panop.html
          if-no-files-found: ignore