name: Build Windows Applications

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: "pip"

      # --------------------------------------------------
      # Dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cu128
          pip install -r requirements.txt

      # --------------------------------------------------
      # Confirm correct torch and torchvision versions
      # --------------------------------------------------
      - name: Confirm correct torch and torchvision versions
        run: |
          pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cu128

      # --------------------------------------------------
      # Install pyinstaller
      # --------------------------------------------------
      - name: Install pyinstaller
        run: |
          pip install pyinstaller

      # --------------------------------------------------
      # Install local package
      # --------------------------------------------------
      - name: Install local package
        run: |
          pip install .

      # --------------------------------------------------
      # Confirm local package installation
      # --------------------------------------------------
      - name: Confirm local package installation
        run: |
          pip list
          python -c "import sys; print('Python:', sys.executable)"
          pip show -f panopticon
          python -c "import importlib.metadata as m; d=m.distribution('panopticon'); print('TOP_LEVEL.TXT:', repr(d.read_text('top_level.txt'))); print('INSTALLED FILES:'); print('\n'.join(str(f) for f in d.files or []))"
          python -c "import panopticon; print(panopticon.__file__)"
          python -c "from panopticon.my_inference.detect import Detector; print('!!!!!!DETECTOR IMPORTED SUCCESSFULLY!!!!!!')"

      # --------------------------------------------------
      # Build App 1
      # --------------------------------------------------
      - name: Build App 1
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "panop" `
            --collect-submodules panopticon `
            pan_opticon.py

      # --------------------------------------------------
      # Build App 2
      # --------------------------------------------------
      - name: Build App 2
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "pananno" `
            --collect-submodules panopticon `
            pan_annotator.py

      # --------------------------------------------------
      # Build App 3
      # --------------------------------------------------
      - name: Build App 3
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "pantrain" `
            --collect-submodules panopticon `
            pan_trainer.py

      # --------------------------------------------------
      # Put everything into one release directory
      # --------------------------------------------------
      - name: Prepare release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          Copy-Item -Recurse dist/panop release/panop
          Copy-Item -Recurse dist/pananno release/pananno
          Copy-Item -Recurse dist/pantrain release/pantrain

      # --------------------------------------------------
      # Upload all three
      # --------------------------------------------------
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: MyApps-Windows
          path: release/
