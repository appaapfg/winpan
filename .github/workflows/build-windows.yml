name: Build Windows Applications

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: "pip"

      # --------------------------------------------------
      # Dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cu128
          pip install -r requirements.txt

      # --------------------------------------------------
      # Confirm correct torch and torchvision versions
      # --------------------------------------------------
      - name: Confirm correct torch and torchvision versions
        run: |
          pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cu128

      # --------------------------------------------------
      # Install pyinstaller
      # --------------------------------------------------
      - name: Install pyinstaller
        run: |
          pip install pyinstaller

      # --------------------------------------------------
      # Install local package
      # --------------------------------------------------
      - name: Install local package
        run: |
          pip install .

      # --------------------------------------------------
      # Test my_inference import
      # --------------------------------------------------
      - name: Test my_inference import
        timeout-minutes: 15
        run: |
          python -u -c "print('IMPORT START', flush=True); import panopticon.my_inference; print('IMPORT COMPLETE', flush=True)"

      # --------------------------------------------------
      # Instrument PyInstaller DLL analysis
      # --------------------------------------------------
      - name: Instrument PyInstaller DLL analysis
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import PyInstaller.building.build_main as bm

          path = Path(bm.__file__)
          source = path.read_text(encoding="utf-8")
          old = "                __import__(package)"
          new = (
              '                print('
              'f"PYI_DLL_IMPORT_START {package}", '
              'file=__import__("sys").stderr, flush=True)\n'
              + old
          )

          if source.count(old) != 1:
              raise SystemExit(
                  f"Expected one target in {path}; refusing to modify it."
              )

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          print(f"Instrumented {path}")
          '@ | python -

      # --------------------------------------------------
      # Build App 1
      # --------------------------------------------------
      - name: Build App 1
        shell: pwsh
        timeout-minutes: 25
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "panop" `
            --log-level DEBUG `
            pan_opticon.py 2>&1 |
            Tee-Object -FilePath pyinstaller-debug.log

          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          Write-Host "panop build completed successfully."

      # --------------------------------------------------
      # Build App 2
      # --------------------------------------------------
      - name: Build App 2
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "pananno" `
            --log-level DEBUG `
            pan_annotator.py

      # --------------------------------------------------
      # Build App 3
      # --------------------------------------------------
      - name: Build App 3
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "pantrain" `
            --log-level DEBUG `
            pan_trainer.py

      # --------------------------------------------------
      # Put everything into one release directory
      # --------------------------------------------------
      - name: Prepare release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          Copy-Item -Recurse dist/panop release/panop
          Copy-Item -Recurse dist/pananno release/pananno
          Copy-Item -Recurse dist/pantrain release/pantrain

      # --------------------------------------------------
      # Upload all three
      # --------------------------------------------------
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: MyApps-Windows
          path: release/
