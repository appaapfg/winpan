name: Build Windows Applications

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: "pip"

      # --------------------------------------------------
      # Dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cu128
          pip install -r requirements.txt

      # --------------------------------------------------
      # Confirm correct torch and torchvision versions
      # --------------------------------------------------
      - name: Confirm correct torch and torchvision versions
        run: |
          pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cu128

      # --------------------------------------------------
      # Install pyinstaller
      # --------------------------------------------------
      - name: Install pyinstaller
        run: |
          pip install pyinstaller

      # --------------------------------------------------
      # Install local package
      # --------------------------------------------------
      - name: Install local package
        run: |
          pip install .

      # --------------------------------------------------
      # Test PyTorch and Ultralytics imports
      # --------------------------------------------------
      - name: Test PyTorch and Ultralytics imports
        shell: pwsh
        timeout-minutes: 15
        run: |
          Write-Host "Testing PyTorch..."

          python -c "import time; t=time.time(); import torch; print('PyTorch import completed in', round(time.time()-t, 2), 'seconds')"

          if ($LASTEXITCODE -ne 0) {throw "PyTorch import failed"}

          Write-Host "Testing Ultralytics..."

          python -c "import time; t=time.time(); import ultralytics; print('Ultralytics import completed in', round(time.time()-t, 2), 'seconds')"

          if ($LASTEXITCODE -ne 0) {throw "Ultralytics import failed"}

      # --------------------------------------------------
      # Build App 1
      # --------------------------------------------------
      - name: Build App 1
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "panop" `
            --log-level DEBUG `
            pan_opticon.py

      # --------------------------------------------------
      # Build App 2
      # --------------------------------------------------
      - name: Build App 2
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "pananno" `
            --log-level DEBUG `
            pan_annotator.py

      # --------------------------------------------------
      # Build App 3
      # --------------------------------------------------
      - name: Build App 3
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "pantrain" `
            --log-level DEBUG `
            pan_trainer.py

      # --------------------------------------------------
      # Put everything into one release directory
      # --------------------------------------------------
      - name: Prepare release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          Copy-Item -Recurse dist/panop release/panop
          Copy-Item -Recurse dist/pananno release/pananno
          Copy-Item -Recurse dist/pantrain release/pantrain

      # --------------------------------------------------
      # Upload all three
      # --------------------------------------------------
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: MyApps-Windows
          path: release/
